# Compose Multiplatform - spike only. Explicit coordinates rather than the `compose.xxx` DSL
# accessors, which are deprecated in 1.11.1.
cmp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
cmp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
cmp-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
# Replaces the deprecated `compose.components.uiToolingPreview`. It declares the annotation under the
# androidx package name for every target, so common and Android code share one import.
cmp-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
# The JetBrains republish of androidx lifecycle. The plain `androidx.lifecycle` artifacts are
# Android only; these carry the uikit targets, so ViewModel, viewModelScope, `viewModel { }` and
# collectAsStateWithLifecycle can all be used from commonMain.
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }
# Replacement for the deprecated `androidx.compose.ui.backhandler.BackHandler`.
# The JetBrains republish, not `androidx.navigationevent:navigationevent-compose` - the plain androidx
# one ships Android/JVM variants only and cannot be used from commonMain.
androidx-navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationEvent" }
cmp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "cmpMaterial3" }
cmp-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "cmpIcons" }

