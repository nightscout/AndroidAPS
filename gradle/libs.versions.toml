# Test-only oracle. On Android `org.json` comes from the platform, so a plain JVM test has no real
# implementation to compare against. This is AOSP's own org.json, repackaged for the JVM - NOT
# Crockford's `org.json:json`, which is a different implementation and disagrees on real cases
# (optString of a JSON null gives "" there and "null" on Android). It is what jsonassert already
# pulls in, so Android module tests are measured against this too. Never use it in main source.
org-json-android = { group = "com.vaadin.external.google", name = "android-json", version = "0.0.20131108.vaadin1" }
