room = "2.8.4"
sqlite = "2.7.0"
dagger = "2.60.1"
mockito = "5.23.0"
junit = "6.1.2"
robolectric = "4.16.1"
okhttp = "5.4.0"
retrofit = "3.0.0"
ktor = "3.3.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
work = "2.11.2"
androidxHilt = "1.4.0"
datastorePreferences = "1.2.1"

# Compose
activityCompose = "1.13.0"
composeBom = "2026.06.01"
wearCompose = "1.6.2"
hiltNavigationCompose = "1.4.0"
navigationCompose = "2.9.8"
lifecycleRuntimeKtx = "2.11.0"
vico = "3.2.3"
composeUi = "1.11.4"
glance = "1.1.1"

# Compose Multiplatform - spike only, see :spike:cmp. Separate from the androidx Compose above:
# CMP publishes the same androidx.compose.* package names and its Android variants delegate to
# androidx, so the composeBom still decides the Android versions.
# 1.11.1 rather than 1.12.0-beta03 on purpose: the beta's Android side delegates to androidx
# 1.12.0-beta02, which would drag a pre-release androidx into an app pinned to stable 1.11.x.
composeMultiplatform = "1.11.1"
navigationEvent = "1.0.1"
jetbrainsLifecycle = "2.9.6"
# material3 and material-icons-extended are separate, lagging version lines in CMP.
cmpMaterial3 = "1.9.0"
cmpIcons = "1.7.3"

[plugins]
android-library = { id = "com.android.library" }
# No version, exactly like android-library above: both plugin ids ship in com.android.tools.build:gradle,
# which is already on the root buildscript classpath. AGP 9 refuses com.android.library together with
# the Kotlin multiplatform plugin, so a multiplatform module with an Android target needs this one.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library" }
klint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.10" }
android-test = { id = "com.android.test", version.ref = "gradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Compose Multiplatform framework plugin. It hard-fails unless compose-compiler above is applied in
# the same module - the compiler itself ships with Kotlin, this plugin only adds the framework.
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }

[libraries]
com-android-tools-build = { group = "com.android.tools.build", name = "gradle", version.ref = "gradlePlugin" }
com-google-gms = { group = "com.google.gms", name = "google-services", version.ref = "googleServices" }

com-google-dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }
