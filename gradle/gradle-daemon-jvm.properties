# Criteria for the JVM that runs the Gradle daemon.
#
# Only the version is pinned on purpose. Do not add toolchainVendor or toolchainUrl lines
# here, and do not commit the output of `updateDaemonJvm` without removing them: CI sets up
# Temurin, so asking for another vendor makes Gradle download a JDK from api.foojay.io on
# every runner. The ids that task writes are tied to single packages, and when they stopped
# working in October 2026 every CI job failed before it compiled anything.
toolchainVersion=21
