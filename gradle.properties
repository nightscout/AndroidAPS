# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.warning.mode=all
# -Xss4m, not the -Xss1024m this used to say: that is a 1 GB stack *per thread*, and with
# workers.max=12 it reserved a nonsense amount of address space. Linux commits stacks lazily so it
# never showed up as a failure, which is why it survived so long. These args go to the Gradle daemon
# only - the Kotlin compiler runs in its own daemon below and never saw this - and Gradle's own
# threads do not recurse deeply, so 4m is already generous.
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Xss4m
org.gradle.workers.max=12
# 4g, not 2g. Measured on the CI runner with -Xlog:gc: the compile daemon's live set after a full
# collection reaches about 1.4 GB, and at a 3g ceiling it spent 42 s in GC doing 66 full collections,
# one of which recovered 22 MB out of 2423 - the spiral that made build 41233 die with "GC overhead
# limit exceeded". 2g was below even that. CircleCI's compile step overrides this to 6g because it
# runs the whole cold build at full parallelism; 4g is the everyday figure for local builds and for
# the later CI steps, which compile less. Note the value is COMMA separated if more than one option.
kotlin.daemon.jvm.options=-Xmx4g

# The build cache, which is NOT the configuration cache commented out further down - that one is
# disabled for a real reason and stays disabled. This one stores task outputs keyed on task inputs
# and replays them when the inputs match.
#
# CI recompiled the whole project on every run: build 41233 reported "1084 actionable tasks: 1084
# executed" with not one cache hit, because nothing had ever been stored. The CircleCI runner is
# self-hosted and its home directory persists between jobs (~/.kotlin dates from 2025), so the
# default local cache at ~/.gradle/caches/build-cache-1 survives from one build to the next with no
# save/restore steps. Gradle prunes entries after 7 days on its own.
#
# It also takes pressure off the Kotlin daemon: a task replayed from cache is a compilation that
# never runs, and it was the count of concurrent cold compilations that exhausted the heap above.
org.gradle.caching=true

android.enableJetifier=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# Cache is causeing issues with CircleCI nad maybe Studio 2021
# org.gradle.unsafe.configuration-cache=true

android.nonFinalResIds=true

ksp.incremental=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# ignore ios targets on windows
kotlin.native.ignoreDisabledTargets=true
