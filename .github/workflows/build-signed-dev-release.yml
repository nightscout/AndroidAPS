name: Build Signed Dev Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-signed-dev-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          show-progress: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/build-signed-aaps-release.sh

      - name: Build and verify signed full release APK
        id: build
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SOURCE_BRANCH: dev
        run: .github/scripts/build-signed-aaps-release.sh

      - name: Upload signed AAPS release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-BYOESA-${{ steps.build.outputs.version }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/aaps-release/${{ steps.build.outputs.artifact_name }}
            ${{ runner.temp }}/aaps-release/build-report.json
            ${{ runner.temp }}/aaps-release/checksums.txt
            ${{ runner.temp }}/aaps-release/signature-verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signed-dev-release-diagnostics
          path: |
            ${{ runner.temp }}/aaps-release/build.log
            ${{ runner.temp }}/aaps-release/signature-verification.txt
            app/build/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/aaps-signing"
