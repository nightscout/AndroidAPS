name: Build Signed AAPS Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to build
        required: true
        default: dev
        type: choice
        options:
          - dev
          - master

permissions:
  contents: read

concurrency:
  group: build-signed-aaps-release-${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.ref_name }}
          fetch-depth: 0
          show-progress: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify clean build scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -f gradlew ]]
          [[ -f .github/scripts/build-signed-aaps-release.sh ]]
          bash -n gradlew
          bash -n .github/scripts/build-signed-aaps-release.sh
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Tracked checkout changes detected before the release build:" >&2
            git status --short >&2
            exit 1
          fi

      - name: Build and verify signed full release APK
        id: build
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.ref_name }}
        run: bash .github/scripts/build-signed-aaps-release.sh

      - name: Upload signed AAPS release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-BYOESA-${{ steps.build.outputs.source_branch }}-${{ steps.build.outputs.version }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/aaps-release/${{ steps.build.outputs.artifact_name }}
            ${{ runner.temp }}/aaps-release/build-report.json
            ${{ runner.temp }}/aaps-release/checksums.txt
            ${{ runner.temp }}/aaps-release/signature-verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signed-aaps-release-diagnostics
          path: |
            ${{ runner.temp }}/aaps-release/build.log
            ${{ runner.temp }}/aaps-release/signature-verification.txt
            app/build/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/aaps-signing"
