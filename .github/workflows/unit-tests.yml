name: Unit tests (JVM)

# EXPERIMENT: moving the unit suite off the self-hosted CircleCI runner.
#
# Today `.circleci/config.yml` runs the whole unit suite on the same self-hosted machine as three
# emulators, in a step named "pinned off the emulator cores ... overlaps the shards". That contention
# is the documented cause of emulators dropping offline mid-instrumentation, and it shows up as
# `comboctl` unit tests and emulator UI tests going red while passing locally.
#
# Nothing here needs a device, so it runs on a GitHub-hosted runner instead. Coverage is uploaded to
# Codecov under the `unit` flag; CircleCI uploads the instrumented run under `instrumented`. Codecov
# merges uploads that carry the same commit SHA, so the combined number is the union of the two - a
# line covered by either source counts as covered.
on:
  workflow_dispatch:
  push:
    branches:
      - ci-split-test
  pull_request:
    branches:
      - ci-split-test

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Load jdk version
        run: |
          JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      # The bit is 100755 in the index and `ios-ci.yml` runs ./gradlew without this, but four other
      # workflows set it anyway. A checkout of a contributor's fork can arrive without it, and the
      # failure is a bare "Permission denied" that looks nothing like its cause.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # The repo's gradle.properties is tuned for the 64 GB self-hosted runner: 8g for Gradle and 12
      # workers. A GitHub-hosted runner has 4 vCPU and 16 GB, so that plus the forked test JVMs
      # oversubscribes it and the runner is killed outright - the job ends with "exit code 143" and
      # "The runner has received a shutdown signal", which reads like an infrastructure blip rather
      # than the memory setting it is. gradle.properties in GRADLE_USER_HOME takes precedence over the
      # project one, so this leaves the self-hosted tuning untouched.
      #
      # The Kotlin daemon keeps its 4g. That number is measured, not guessed: gradle.properties records
      # that a 3g ceiling sent the compile daemon into a GC spiral (66 full collections, 42 s in GC)
      # and killed build 41233 with "GC overhead limit exceeded". Cutting it here would buy memory by
      # reintroducing a known failure. The budget comes out of Gradle and the worker count instead:
      # 3g daemon + 4g Kotlin + at most 3 test JVMs at 1536m each is about 11.5g of the 16g.
      - name: Size the JVMs for a hosted runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Xss4m
          org.gradle.workers.max=3
          kotlin.daemon.jvm.options=-Xmx4g
          EOF
          echo "--- effective overrides ---"; cat ~/.gradle/gradle.properties
          echo "--- runner ---"; nproc; free -g

      # Four task names, because a module lands in exactly one of them and a missing name runs no
      # tests instead of failing. Kept identical to the CircleCI step so this is a move, not a
      # redefinition of what "the unit suite" means:
      #  - testFullDebugUnitTest: the flavoured modules, which are only :app and the :wear ones.
      #  - testDebugUnitTest: the Android libraries, which have no "Full" variant.
      #  - jvmTest and testAndroidHostTest: the multiplatform modules, which have no build variants.
      # `:desktop:shell:test` is named explicitly and must stay: it is a plain `kotlin("jvm")` module
      # whose task is `test`, so it matches none of the four names, and an unqualified `test` would
      # instead match the AGP lifecycle task in every Android module and run every variant of each.
      # Drop this and its tests run on no machine at all.
      - name: Run the unit suite
        run: |
          # Actions runs `bash -e` but NOT pipefail, so without this the exit code of the pipeline
          # would be tee's and a failed Gradle build would report success.
          set -o pipefail
          ./gradlew --console=plain --no-daemon -Pcoverage -PfirebaseDisable \
            testFullDebugUnitTest testDebugUnitTest jvmTest testAndroidHostTest :desktop:shell:test \
            2>&1 | tee unit-tests.log

      # A separate invocation on purpose: running a compile task and jacocoAllDebugReport together
      # trips Gradle's implicit-dependency validation on `:core:data`'s jvm classes and fails the
      # build before the report is written.
      - name: Aggregate coverage
        run: ./gradlew --console=plain --no-daemon jacocoAllDebugReport

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./build/reports/jacoco/jacocoAllDebugReport/jacocoAllDebugReport.xml
          flags: unit
          # The merge commit Actions checks out for a pull_request is not the commit Codecov should
          # attribute this to; without this the upload lands on a commit CircleCI never reports on and
          # the two halves never merge.
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          # Stays false, and the next step is why. This action runs several calls (create-commit,
          # create-report, do-upload) and on this repo the first two answer 'Repository not found' on
          # every run while do-upload succeeds and the coverage lands correctly - verified by comparing
          # commits: 008c08ecee reported that error and still has a complete report, while 1c28d04e57,
          # whose job died before uploading, has no report at all. So turning this to true failed the
          # job on every single run with the coverage perfectly fine. A build that is always red teaches
          # people to ignore red, which is worse than the silence it was meant to fix.
          fail_ci_if_error: false

      # The real check. The uploader's exit code describes the tool; this describes the outcome, which
      # is the thing worth failing on: does Codecov actually have a report for this commit? It is loud
      # when coverage genuinely fails to land and quiet about the create-commit noise above.
      # No token needed - the repo is public and this is a read.
      - name: Check the coverage actually landed
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          API="https://api.codecov.io/api/v2/github/nightscout/repos/AndroidAPS/commits/$SHA"
          # Codecov processes uploads asynchronously, so a miss right after the upload means "not yet",
          # not "never". Poll for up to 6 minutes before calling it a failure.
          for i in $(seq 1 36); do
            code=$(curl -sS -o /tmp/codecov-commit.json -w '%{http_code}' "$API" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Codecov has a report for $SHA:"
              jq -r '"  state=\(.state)  coverage=\(.totals.coverage)  lines=\(.totals.lines)"' /tmp/codecov-commit.json
              exit 0
            fi
            echo "attempt $i: HTTP $code - no report yet, waiting 10s"
            sleep 10
          done
          echo "::error::Codecov has no report for $SHA after 6 minutes. The coverage upload did not land."
          exit 1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            unit-tests.log
          retention-days: 7
